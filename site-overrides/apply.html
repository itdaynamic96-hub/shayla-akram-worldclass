<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>সহায়তার আবেদন</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app-config.js"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script></head>
<body><header class="nav"><div class="wrap navin"><a class="brand" href="index.html"><span class="logo">۞</span><span>ফাউন্ডেশন সহায়তা<small>APPLICATION SERVICE</small></span></a><a class="btn" href="index.html">হোম</a></div></header>
<section class="pagehero"><div class="wrap"><span class="eyebrow">FOUNDATION SUPPORT</span><h1>সহায়তার আবেদন</h1><p>আপনার তথ্য গোপনীয়ভাবে জমা হবে এবং শুধু অনুমোদিত অ্যাডমিন দেখতে পারবেন।</p></div></section>
<main class="wrap" style="padding:30px 0"><section class="adminbox"><form id="intakeForm" data-kind="application"><div class="field"><label for="name">পূর্ণ নাম</label><input id="name" name="name" maxlength="120" required></div><div class="field"><label for="phone">মোবাইল নম্বর</label><input id="phone" name="phone" type="tel" maxlength="25" required></div><div class="field"><label for="address">ঠিকানা</label><textarea id="address" name="address" maxlength="1200" required></textarea></div><div class="field"><label for="category">সহায়তার ধরন</label><select id="category" name="category" required><option value="">নির্বাচন করুন</option><option>চিকিৎসা</option><option>শিক্ষা</option><option>আর্থিক সহায়তা</option><option>জরুরি সহায়তা</option><option>অন্যান্য</option></select></div><div class="field"><label for="details">আবেদনের বিস্তারিত</label><textarea id="details" name="details" maxlength="3000" required></textarea></div><div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><div id="turnstile" style="margin:16px 0"></div><button class="btn" type="submit">নিরাপদে আবেদন জমা দিন</button><p id="formMsg" role="status" class="muted"></p></form><p class="muted">জরুরি অবস্থায় সরাসরি ফাউন্ডেশনের দায়িত্বশীল ব্যক্তির সঙ্গে যোগাযোগ করুন।</p></section></main>
<script type="module" src="assets/forms.js"></script></body></html>
