name: Deploy World-Class Hybrid Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/**'
      - 'tests/cloudflare-backend.test.mjs'
      - 'tests/youtube.test.mjs'
      - '.github/workflows/deploy-cloudflare-worker.yml'

permissions:
  contents: read

concurrency:
  group: worldclass-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Worker source and tests
        run: |
          node --check cloudflare/src/index.js
          node --test tests/cloudflare-backend.test.mjs tests/youtube.test.mjs

      - name: Deploy Worker without running legacy D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.toml
