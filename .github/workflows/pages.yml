name: Deploy static website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare website files
        run: |
          mkdir -p site
          tar -xzf site-source.tar.gz -C site
          cp -R site-overrides/. site/
          sed -i 's#</head>#<link rel="stylesheet" href="assets/menu.css"></head>#' site/index.html
          sed -i 's#<script type="module" src="assets/site.js">#<script src="assets/app-config.js"></script><script type="module" src="assets/site.js">#' site/index.html
          sed -i 's#<script type="module" src="assets/module.js">#<script src="assets/app-config.js"></script><script type="module" src="assets/module.js">#' site/module.html
          sed -i 's#assets/module.js"#assets/module.js?v=20261125-audiofix"#' site/module.html
          sed -i 's#</body>#<script src="assets/menu.js" defer></script></body>#' site/index.html
      - name: Validate website files and tests
        run: |
          test -s site/index.html
          test -s site/modules.json
          test -s site/content.json
          test -s site/videos.html
          test -s site/video-admin.html
          test -s site/videos.json
          test -s site/setup.html
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('site/modules.json')); const c=JSON.parse(fs.readFileSync('site/content.json')); const v=JSON.parse(fs.readFileSync('site/videos.json')); if(m.length!==25) throw Error('Expected 25 modules'); if(m.filter(x=>x.group==='mosque').length!==16) throw Error('Mosque module count mismatch'); if(m.filter(x=>x.group==='foundation').length!==9) throw Error('Foundation module count mismatch'); if(new Set(m.map(x=>x.id)).size!==m.length) throw Error('Duplicate module IDs'); if(!Array.isArray(c)||!Array.isArray(v)) throw Error('JSON files must be arrays'); for(const x of c){if(!m.some(y=>y.id===Number(x.moduleId))||!String(x.title||'').trim()||!String(x.body||'').trim()) throw Error('Invalid content item');}"
          for file in site/assets/menu.js site/assets/site.js site/assets/module.js site/assets/admin.js site/assets/forms.js site/assets/setup.js site/assets/video-gallery.js site/assets/video-admin.js; do node --input-type=module --check < "$file"; done
          node --check site/assets/youtube.mjs
          node --check cloudflare/src/index.js
          node --test tests/youtube.test.mjs tests/cloudflare-backend.test.mjs tests/worldclass-frontend.test.mjs
          if grep -Eiq 'appwrite|YOUR_' site/assets/site.js site/assets/module.js site/assets/admin.js site/assets/app-config.js; then echo "Unexpected backend dependency or placeholder in static mode"; exit 1; fi
          for page in index.html module.html admin.html apply.html volunteer.html videos.html setup.html; do grep -q 'assets/app-config.js' "site/$page" || { echo "Missing API config in $page"; exit 1; }; done
          grep -q 'assets/app-config.js' site/index.html
          grep -q 'assets/app-config.js' site/module.html
          grep -q 'assets/menu.js' site/index.html
          grep -q 'CLOUDFLARE D1 ADMINISTRATION' site/admin.html
          grep -q 'turnstile' site/apply.html
          grep -q 'turnstile' site/volunteer.html
          grep -q 'প্রাথমিক অ্যাডমিন সেটআপ' site/admin.html
          test -s site/apply.html
          test -s site/volunteer.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
