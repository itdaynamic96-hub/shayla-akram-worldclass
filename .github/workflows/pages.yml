name: Deploy static website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare website files
        run: |
          mkdir -p site
          tar -xzf site-source.tar.gz -C site
          cp -R site-overrides/. site/
          sed -i 's#</head>#<link rel="stylesheet" href="assets/menu.css"></head>#' site/index.html
          sed -i 's#</body>#<script src="assets/menu.js" defer></script></body>#' site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
